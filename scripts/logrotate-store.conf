# Size-based rotation of the store/*.log files (#767, 2026-11-02).
# store/remote-control.log reached 326 MB: the remote-control TUI repaints its
# status block into a file opened with StandardOutput=append, and nothing rotated it.
# copytruncate, because the writers (systemd append:, shell >>) keep the file open.
# Run by marveen-log-forgatas.timer with a user state file (no root needed).
/home/gabor/marveen/store/*.log {
    size 50M
    rotate 2
    compress
    copytruncate
    missingok
    notifempty
}
